# Daily automatic run for the stock app.
#
# THIS FILE IS A TEMPLATE. It lives under deploy/ in the public app repo, where
# GitHub does NOT run it. In the final setup stage it is copied into the PRIVATE
# repo evm22/stock-app-data (to .github/workflows/daily.yml), where it:
#   1. runs the scan with the app's own engine,
#   2. saves data/screen_results.json + appends data/score_history.csv,
#   3. visits the live app so it isn't asleep,
#   4. commits the new data back to the private repo,
#   5. sends a one-line summary (or a failure alert) to Telegram.
#
# Timing: GitHub's scheduler uses UTC and ignores summer/winter time, so we
# fire at 04:00 and 05:00 UTC (= 06:00/07:00 Israel in winter, 07:00/08:00 in
# summer). daily_job.py skips anything before 07:00 Israel time and anything
# after the day's run already happened, so exactly one run per day goes ahead.
# GitHub may start scheduled jobs late, so the summary usually lands by ~09:00.
#
# Because this workflow commits data every day, the private repo never counts
# as "inactive", so GitHub's 60-day auto-disable of scheduled jobs doesn't hit.

name: daily

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only scan the first N stocks (empty = all)"
        required: false
        default: ""
      force:
        description: "Run even if it already ran today / it's early"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false   # a second trigger waits, then the guard skips it

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out the data repo
        uses: actions/checkout@v4

      - name: Check out the app code
        uses: actions/checkout@v4
        with:
          repository: evm22/stock-app
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-job.txt

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt -r app/requirements-job.txt
          python -m playwright install --with-deps chromium

      - name: Run the daily job
        env:
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=(--data-dir .)
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then ARGS+=(--limit "$LIMIT"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          python app/daily_job.py "${ARGS[@]}"

      - name: Keep the live app awake
        continue-on-error: true
        run: python app/keep_awake.py

      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes (the time guard skipped this run)."
          else
            git commit -m "daily data $(TZ=Asia/Jerusalem date +%F)"
            # The app saves trades / the watchlist into this repo too, maybe
            # while the scan ran: take those first, then push (3 tries).
            for i in 1 2 3; do
              git pull --rebase -q && git push && exit 0
              sleep 10
            done
            exit 1
          fi
