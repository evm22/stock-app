# Theme for the app (redesign Stage 2 -- mockup "המניות שלי – הדמיה", item 5).
# Dark palette taken from the mockup. No secrets here (those live in
# secrets.toml, which stays git-ignored).
[theme]
base = "dark"
primaryColor = "#8EA2FF"
backgroundColor = "#0D1320"
secondaryBackgroundColor = "#151D2B"
textColor = "#E7ECF4"
borderColor = "#283347"
font = "sans serif"

[client]
toolbarMode = "minimal"
